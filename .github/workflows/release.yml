name: Auto Release QGIS Plugin

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Bump version
        id: bump
        run: |
          python scripts/bump_version.py > new_version.txt
          echo "version=$(cat new_version.txt)" >> $GITHUB_OUTPUT

      - name: Commit bumped version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add metadata.txt
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci

      - name: Validate and package plugin
        id: package
        run: |
          qgis-plugin-ci package
          ZIP_FILE=$(ls build/*.zip)
          echo "zip_file=${ZIP_FILE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release ${{ steps.bump.outputs.version }}
          files: ${{ steps.package.outputs.zip_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
